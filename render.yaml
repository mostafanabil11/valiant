# Render blueprint for the Valiant API.
#
# The frontend is not here: it stays on Vercel. This file describes only the
# NestJS backend, which needs a host that runs a persistent process — the
# order and cart schedulers are in-process cron jobs (see orders.scheduler.ts),
# and a serverless platform would never run them.
#
# Secrets are deliberately marked sync:false rather than written here, so they
# are entered in the Render dashboard and never committed. See README.md.
services:
  - type: web
    name: valiant-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: Backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod

    # Render restarts the service if this stops responding. AppController's
    # /health returns a plain ok without touching the database, so a slow
    # query can't be mistaken for a dead process.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      # Render assigns the port and expects the process to bind it.
      - key: PORT
        value: "10000"

      # Set in the dashboard, not here.
      #
      # MONGODB_URI   Atlas connection string (mongodb+srv://...)
      # JWT_SECRET    at least 32 chars — openssl rand -base64 48
      # FRONTEND_URL  the Vercel site URL; accepts a comma-separated list so
      #               preview deployments and a custom domain also pass CORS
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: OTP_EXPIRATION_MINUTES
        value: "10"
      - key: MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: LOCK_TIME_MINUTES
        value: "15"

      # Optional. Email is needed for order confirmations and OTP; without it
      # those silently no-op. Card checkout stays disabled unless all four
      # PAYMOB_* values are present, and cash on delivery keeps working.
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: PAYMOB_API_KEY
        sync: false
      - key: PAYMOB_INTEGRATION_ID
        sync: false
      - key: PAYMOB_IFRAME_ID
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
